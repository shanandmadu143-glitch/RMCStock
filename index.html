<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>RMC Daily Stock</title>
    <!-- SheetJS (XLSX) Library -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary-bg: #0f172a;
            --accent-blue: #2563eb;
            --accent-blue-hover: #1d4ed8;
            --accent-green: #10b981;
            --accent-green-hover: #059669;
            --accent-amber: #f59e0b;
            --bg-body: #f8fafc;
            --card-bg: #ffffff;
            --text-dark: #0f172a;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --shadow-sm: 0 1px 3px rgba(0,0,0,0.05);
            --shadow-md: 0 4px 6px -1px rgba(0,0,0,0.1), 0 2px 4px -1px rgba(0,0,0,0.06);
            --shadow-lg: 0 20px 25px -5px rgba(0,0,0,0.1), 0 10px 10px -5px rgba(0,0,0,0.04);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-body);
            color: var(--text-dark);
            padding: 16px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 800px;
            margin: 0 auto;
        }

        /* Top Header Navigation Block */
        .header-block {
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
            color: #ffffff;
            padding: 18px 22px;
            border-radius: 16px;
            box-shadow: var(--shadow-md);
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .brand-title {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 1.35rem;
            font-weight: 700;
            letter-spacing: -0.3px;
        }

        .brand-title i {
            color: #60a5fa;
            font-size: 1.5rem;
        }

        /* Top-Right Icon Actions */
        .icon-actions {
            display: flex;
            gap: 10px;
        }

        .btn-icon-header {
            width: 42px;
            height: 42px;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.12);
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(8px);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-icon-header:active, .btn-icon-header:hover {
            background: rgba(255, 255, 255, 0.25);
            transform: scale(1.05);
        }

        /* Main Entry Card */
        .card {
            background: var(--card-bg);
            border-radius: 16px;
            border: 1px solid var(--border-color);
            padding: 22px;
            box-shadow: var(--shadow-sm);
        }

        /* Form Controls */
        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
            margin-bottom: 20px;
        }

        @media (max-width: 640px) {
            .form-grid {
                grid-template-columns: 1fr;
            }
            body {
                padding: 10px;
            }
            .header-block {
                padding: 16px 18px;
            }
            .brand-title {
                font-size: 1.2rem;
            }
            .card {
                padding: 16px;
            }
        }

        .form-group {
            position: relative;
        }

        label {
            display: block;
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--text-muted);
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        input[type="text"], input[type="number"], select, input[type="file"] {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid var(--border-color);
            border-radius: 10px;
            font-size: 0.95rem;
            color: var(--text-dark);
            background-color: #fff;
            outline: none;
            transition: all 0.2s;
        }

        input:focus, select:focus {
            border-color: var(--accent-blue);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
        }

        /* Search Results Dropdown */
        .search-results {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background: white;
            border: 1px solid var(--border-color);
            border-radius: 10px;
            max-height: 220px;
            overflow-y: auto;
            z-index: 100;
            box-shadow: var(--shadow-lg);
            margin-top: 4px;
        }

        .search-item {
            padding: 12px 14px;
            cursor: pointer;
            border-bottom: 1px solid #f1f5f9;
            font-size: 0.88rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .search-item:hover {
            background-color: #eff6ff;
            color: var(--accent-blue);
        }

        .selected-badge {
            background: #eff6ff;
            border: 1px solid #bfdbfe;
            padding: 14px;
            border-radius: 10px;
            font-size: 0.88rem;
            color: #1e40af;
            display: none;
            margin-bottom: 16px;
            line-height: 1.5;
        }

        /* Standard Buttons */
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 12px 20px;
            border-radius: 10px;
            font-size: 0.92rem;
            font-weight: 600;
            border: none;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: var(--shadow-sm);
        }

        .btn-primary {
            background: var(--accent-blue);
            color: white;
        }

        .btn-primary:active {
            background: var(--accent-blue-hover);
            transform: scale(0.99);
        }

        .btn-success {
            background: var(--accent-green);
            color: white;
        }

        .btn-success:active {
            background: var(--accent-green-hover);
            transform: scale(0.99);
        }

        /* Modal / Popup Styling */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(4px);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 12px;
        }

        .modal-content {
            background: white;
            padding: 20px;
            border-radius: 16px;
            width: 100%;
            max-width: 550px;
            box-shadow: var(--shadow-lg);
            animation: fadeIn 0.2s ease-out;
            max-height: 90vh;
            display: flex;
            flex-direction: column;
        }

        .modal-content-large {
            max-width: 750px;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.97); }
            to { opacity: 1; transform: scale(1); }
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 14px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 10px;
        }

        .modal-header h3 {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--text-dark);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .close-btn {
            background: #f1f5f9;
            border: none;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            font-size: 1rem;
            cursor: pointer;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .table-responsive {
            overflow-x: auto;
            overflow-y: auto;
            max-height: 60vh;
            border-radius: 8px;
            border: 1px solid var(--border-color);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            font-size: 0.88rem;
            white-space: nowrap;
        }

        th {
            background: #f1f5f9;
            color: var(--text-dark);
            font-weight: 600;
            padding: 10px 12px;
            position: sticky;
            top: 0;
            border-bottom: 2px solid var(--border-color);
            z-index: 10;
        }

        td {
            padding: 10px 12px;
            border-bottom: 1px solid var(--border-color);
        }

        .val-receipt {
            color: var(--accent-green);
            font-weight: 600;
        }

        .val-issues {
            color: #ef4444;
            font-weight: 600;
        }

        .val-return {
            color: var(--accent-amber);
            font-weight: 600;
        }

        .closing-stock {
            font-weight: 700;
            color: var(--accent-blue);
        }

        .setting-option {
            margin-bottom: 14px;
            background: #f8fafc;
            padding: 14px;
            border-radius: 10px;
            border: 1px solid var(--border-color);
        }

        .setting-option p {
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-bottom: 10px;
        }

        /* --- Top Positioned Toast Notifications System --- */
        #toastContainer {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            gap: 10px;
            pointer-events: none;
            max-width: 90vw;
            width: 360px;
        }

        .toast {
            pointer-events: auto;
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 14px 18px;
            border-radius: 12px;
            background: #ffffff;
            color: var(--text-dark);
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.15), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
            border-left: 5px solid var(--accent-blue);
            font-size: 0.9rem;
            font-weight: 500;
            animation: slideInDown 0.35s cubic-bezier(0.21, 1.02, 0.73, 1) forwards;
            transition: all 0.3s ease;
        }

        .toast.toast-success {
            border-left-color: var(--accent-green);
        }

        .toast.toast-error {
            border-left-color: #ef4444;
        }

        .toast.toast-warning {
            border-left-color: var(--accent-amber);
        }

        .toast i {
            font-size: 1.25rem;
        }

        .toast-success i { color: var(--accent-green); }
        .toast-error i { color: #ef4444; }
        .toast-warning i { color: var(--accent-amber); }

        .toast-hide {
            animation: slideOutUp 0.35s forwards;
        }

        /* Top-to-Bottom Animation Effects */
        @keyframes slideInDown {
            from {
                opacity: 0;
                transform: translateY(-100%) scale(0.9);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        @keyframes slideOutUp {
            from {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
            to {
                opacity: 0;
                transform: translateY(-80%) scale(0.9);
            }
        }

        @media (max-width: 480px) {
            #toastContainer {
                right: 50%;
                transform: translateX(50%);
                top: 16px;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <!-- Header Block with Icon Buttons on Top Right -->
    <div class="header-block">
        <div class="brand-title">
            <i class="fa-solid fa-boxes-stacked"></i> RMC Daily Stock
        </div>
        <div class="icon-actions">
            <button class="btn-icon-header" onclick="openRecordsModal()" title="Inventory Records Summary">
                <i class="fa-solid fa-chart-pie" style="color: #f59e0b;"></i>
            </button>
            <button class="btn-icon-header" onclick="openSettings()" title="Settings & Backup">
                <i class="fa-solid fa-gear" style="color: #60a5fa;"></i>
            </button>
        </div>
    </div>

    <!-- Main Data Entry Form Card -->
    <div class="card">
        <!-- Material Search -->
        <div class="form-group" style="margin-bottom: 16px;">
            <label><i class="fa-solid fa-magnifying-glass"></i> Search Material (Code / Name):</label>
            <input type="text" id="searchInput" placeholder="Search Material Code or Name..." autocomplete="off">
            <div id="searchResults" class="search-results" style="display:none;"></div>
        </div>

        <!-- Selected Item Badge -->
        <div id="selectedBadge" class="selected-badge">
            <div><i class="fa-solid fa-circle-check"></i> <strong>Selected:</strong> <span id="dispCode"></span> - <span id="dispName"></span></div>
            <div>UOM: <strong id="dispUom"></strong> | Op. Stock (E): <strong id="dispOp"></strong></div>
        </div>

        <!-- Section Select & Amount Input Grid -->
        <div class="form-grid">
            <div class="form-group">
                <label><i class="fa-solid fa-filter"></i> Select Section:</label>
                <select id="sectionSelect">
                    <option value="F">F Section - Receipt (එකතු වේ [+])</option>
                    <option value="G">G Section - Issues (අඩු වේ [-])</option>
                    <option value="H">H Section - Return (එකතු වේ [+])</option>
                </select>
            </div>
            <div class="form-group">
                <label><i class="fa-solid fa-arrow-up-9-5"></i> Enter Amount:</label>
                <input type="number" id="inputAmount" min="0" placeholder="0.00" inputmode="decimal">
            </div>
        </div>

        <!-- Action Buttons -->
        <button class="btn btn-primary" style="width: 100%; justify-content: center; height: 46px; margin-bottom: 10px;" onclick="addSingleSectionData()">
            <i class="fa-solid fa-check-circle"></i> Submit Transaction
        </button>

        <button class="btn btn-success" style="width: 100%; justify-content: center; height: 46px;" onclick="downloadExcelAndReset()">
            <i class="fa-solid fa-file-excel"></i> Download Excel & Reset
        </button>
    </div>
</div>

<!-- Animated Top Toast Messages Container -->
<div id="toastContainer"></div>

<!-- POPUP MODAL 1: INVENTORY RECORDS SUMMARY -->
<div id="recordsModal" class="modal">
    <div class="modal-content modal-content-large">
        <div class="modal-header">
            <h3><i class="fa-solid fa-chart-pie" style="color:var(--accent-amber);"></i> Inventory Records Summary</h3>
            <button class="close-btn" onclick="closeRecordsModal()">&times;</button>
        </div>
        <div style="margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap;">
            <input type="text" id="modalSearchInput" placeholder="Filter items..." style="max-width: 260px; padding: 8px 12px; font-size:0.88rem;">
        </div>
        <div class="table-responsive">
            <table>
                <thead>
                    <tr>
                        <th>Material Code</th>
                        <th>Material Name</th>
                        <th>Receipt (F)</th>
                        <th>Issues (G)</th>
                        <th>Return (H)</th>
                        <th>Closing Stock (K)</th>
                    </tr>
                </thead>
                <tbody id="summaryTableBody">
                    <!-- Dynamic Data -->
                </tbody>
            </table>
        </div>
    </div>
</div>

<!-- POPUP MODAL 2: SETTINGS & RESTORE -->
<div id="settingsModal" class="modal">
    <div class="modal-content">
        <div class="modal-header">
            <h3><i class="fa-solid fa-sliders" style="color:var(--accent-blue);"></i> Settings & Data Restore</h3>
            <button class="close-btn" onclick="closeSettings()">&times;</button>
        </div>
        
        <!-- XLSX Restore -->
        <div class="setting-option">
            <label><i class="fa-solid fa-file-excel" style="color:#16a34a;"></i> Restore Excel (.xlsx) File:</label>
            <p>පෙර Save කළ Excel File එකකින් දත්ත Restore කරන්න.</p>
            <input type="file" id="xlsxFileInput" accept=".xlsx, .xls" style="margin-bottom: 8px;">
            <button class="btn btn-success" style="width:100%; justify-content:center; padding: 10px;" onclick="restoreFromXLSX()"><i class="fa-solid fa-file-import"></i> Restore Excel Data</button>
        </div>

        <!-- XLSX Backup Export -->
        <div class="setting-option">
            <label><i class="fa-solid fa-download"></i> Download Excel (.xlsx) Backup File:</label>
            <p>දත්ත වල Backup එකක් Excel File එකක් ලෙස Download කරගන්න.</p>
            <button class="btn" style="background:#475569; color:white; width:100%; justify-content:center; padding: 10px;" onclick="downloadXLSXBackup()"><i class="fa-solid fa-file-export"></i> Export Excel Backup</button>
        </div>
    </div>
</div>

<script>
    // --- Toast Notification Handler with Top Slide Animation ---
    function showToast(message, type = 'success') {
        const container = document.getElementById('toastContainer');
        const toast = document.createElement('div');
        toast.className = `toast toast-${type}`;

        let iconClass = 'fa-circle-check';
        if (type === 'error') iconClass = 'fa-circle-xmark';
        if (type === 'warning') iconClass = 'fa-triangle-exclamation';

        toast.innerHTML = `<i class="fa-solid ${iconClass}"></i> <span>${message}</span>`;
        container.appendChild(toast);

        // Auto dismiss after 3.5 seconds with Animation
        setTimeout(() => {
            toast.classList.add('toast-hide');
            toast.addEventListener('animationend', () => {
                toast.remove();
            });
        }, 3500);
    }

    // Initial Master Items
    let defaultItems = [
        {"type":"RM","code":"11067431","name":"SALT - FLOW","uom":"KG","op_stock":11000},
        {"type":"RM","code":"11061702","name":"WHITE SUGAR","uom":"KG","op_stock":2500},
        {"type":"RM","code":"11002301","name":"MONOSODIUM GLUTAMATE","uom":"KG","op_stock":4525},
        {"type":"RM","code":"67548375","name":"ONION POWDER","uom":"KG","op_stock":120},
        {"type":"RM","code":"11067473","name":"CITRIC ACID MONOHYDRATE (FOOD GRADE)","uom":"KG","op_stock":50},
        {"type":"RM","code":"11002242","name":"SPICE CELERY POWDER","uom":"KG","op_stock":25},
        {"type":"RM","code":"67550393","name":"GARLIC POWDER","uom":"KG","op_stock":25},
        {"type":"RM","code":"67548417","name":"WHITE PEPPER","uom":"KG","op_stock":15},
        {"type":"RM","code":"11002253","name":"SPICE TURMERIC POWDER","uom":"KG","op_stock":4},
        {"type":"RM","code":"11061729","name":"I+G SODIUM 5'RIBONUCLEOTID","uom":"KG","op_stock":40},
        {"type":"RM","code":"11827361","name":"DRIED CORN STARCH 5% MOISTURE-SSL","uom":"KG","op_stock":6000},
        {"type":"RM","code":"11061758","name":"CORN STARCH - IMPORT","uom":"KG","op_stock":0},
        {"type":"RM","code":"11067112","name":"YEAST EXTR. MICROGRANUL. STANDARD 18% SA","uom":"KG","op_stock":400},
        {"type":"RM","code":"11067118","name":"FLAVOUR CHICKEN POWDER (S-2182)","uom":"KG","op_stock":25},
        {"type":"RM","code":"11061730","name":"CARAMEL COLOUR CLASS III (E150C)","uom":"KG","op_stock":20},
        {"type":"RM","code":"11067140","name":"MALTO DEXTRIN 18-20 (M20)","uom":"KG","op_stock":500},
        {"type":"RM","code":"11002220","name":"SPICE NUTMEG POWDER","uom":"KG","op_stock":10},
        {"type":"RM","code":"11002206","name":"SPICE BLACK PEPPER POWDER","uom":"KG","op_stock":150},
        {"type":"RM","code":"11002213","name":"SPICE CORIANDER POWDER","uom":"KG","op_stock":0},
        {"type":"RM","code":"11002214","name":"SPICE CUMIN POWDER","uom":"KG","op_stock":100},
        {"type":"RM","code":"11002211","name":"SPICE CLOVE POWDER","uom":"KG","op_stock":10},
        {"type":"RM","code":"11002210","name":"SPICE CINNAMON POWDER","uom":"KG","op_stock":2}
    ];

    let inventory = defaultItems.map(item => ({
        ...item,
        f_receipt: 0,
        g_issues: 0,
        h_return: 0,
        closing: item.op_stock
    }));

    let selectedIndex = -1;

    // Search Logic
    const searchInput = document.getElementById('searchInput');
    const searchResults = document.getElementById('searchResults');
    const selectedBadge = document.getElementById('selectedBadge');

    searchInput.addEventListener('input', function() {
        const query = this.value.toLowerCase().trim();
        searchResults.innerHTML = '';
        if (!query) {
            searchResults.style.display = 'none';
            return;
        }

        const filtered = inventory.filter(item => 
            String(item.code).toLowerCase().includes(query) || 
            String(item.name).toLowerCase().includes(query)
        );

        if (filtered.length > 0) {
            searchResults.style.display = 'block';
            filtered.forEach(item => {
                const idx = inventory.findIndex(i => i.code === item.code && i.name === item.name);
                const div = document.createElement('div');
                div.className = 'search-item';
                div.innerHTML = `<span><strong>${item.code}</strong> - ${item.name}</span> <span style="color:var(--text-muted); font-size:0.75rem;">${item.op_stock} ${item.uom}</span>`;
                div.onclick = () => selectItem(idx);
                searchResults.appendChild(div);
            });
        } else {
            searchResults.style.display = 'none';
        }
    });

    function selectItem(index) {
        selectedIndex = index;
        const item = inventory[index];
        searchInput.value = `${item.code} - ${item.name}`;
        searchResults.style.display = 'none';

        document.getElementById('dispCode').innerText = item.code;
        document.getElementById('dispName').innerText = item.name;
        document.getElementById('dispUom').innerText = item.uom;
        document.getElementById('dispOp').innerText = item.op_stock.toLocaleString();
        
        selectedBadge.style.display = 'block';
    }

    // Submit Transaction
    function addSingleSectionData() {
        if (selectedIndex === -1) {
            showToast('කරුණාකර Material Code එකක් හෝ Name එකක් Select කරන්න!', 'warning');
            return;
        }

        const targetSection = document.getElementById('sectionSelect').value;
        const amount = parseFloat(document.getElementById('inputAmount').value) || 0;

        if (amount <= 0) {
            showToast('කරුණාකර වලංගු 0 ට වැඩි අගයක් ඇතුළත් කරන්න!', 'error');
            return;
        }

        let item = inventory[selectedIndex];

        if (targetSection === 'F') {
            item.f_receipt += amount;
        } else if (targetSection === 'G') {
            item.g_issues += amount;
        } else if (targetSection === 'H') {
            item.h_return += amount;
        }

        // Calculate K = E + F - G + H
        item.closing = item.op_stock + item.f_receipt - item.g_issues + item.h_return;

        document.getElementById('inputAmount').value = '';

        showToast(`${item.name} හි ${targetSection} Section එකට ${amount} ක් එකතු විය!`, 'success');
    }

    // Modals
    function openRecordsModal() {
        renderSummaryTable();
        document.getElementById('recordsModal').style.display = 'flex';
    }

    function closeRecordsModal() {
        document.getElementById('recordsModal').style.display = 'none';
    }

    // Renders Material Code, Material Name, Dynamic Receipt, Issues, Return, and Closing Stock (K)
    function renderSummaryTable() {
        const tbody = document.getElementById('summaryTableBody');
        tbody.innerHTML = '';
        inventory.forEach(item => {
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td><strong>${item.code}</strong></td>
                <td>${item.name}</td>
                <td class="val-receipt">${Number(item.f_receipt).toLocaleString()}</td>
                <td class="val-issues">${Number(item.g_issues).toLocaleString()}</td>
                <td class="val-return">${Number(item.h_return).toLocaleString()}</td>
                <td class="closing-stock">${Number(item.closing).toLocaleString()} ${item.uom}</td>
            `;
            tbody.appendChild(tr);
        });
    }

    document.getElementById('modalSearchInput').addEventListener('input', function() {
        const q = this.value.toLowerCase().trim();
        const rows = document.querySelectorAll('#summaryTableBody tr');
        rows.forEach(row => {
            const text = row.innerText.toLowerCase();
            row.style.display = text.includes(q) ? '' : 'none';
        });
    });

    function openSettings() {
        document.getElementById('settingsModal').style.display = 'flex';
    }

    function closeSettings() {
        document.getElementById('settingsModal').style.display = 'none';
    }

    // Excel Download & Shift Logic
    function downloadExcelAndReset() {
        const exportData = inventory.map(item => ({
            "Type": item.type,
            "Material Code": item.code,
            "Material Name": item.name,
            "UOM": item.uom,
            "Op.Stock-Warehouse": item.op_stock,
            "Receipt": item.f_receipt,
            "Issues": item.g_issues,
            "Return": item.h_return,
            "Closing Stock": item.closing
        }));

        const worksheet = XLSX.utils.json_to_sheet(exportData);
        const workbook = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(workbook, worksheet, "Stock_Data");

        const today = new Date().toISOString().split('T')[0];
        const filename = `RMC_Daily_Stock_${today}.xlsx`;

        XLSX.writeFile(workbook, filename);

        // Shift Closing Stock -> Opening Stock & Reset
        inventory.forEach(item => {
            item.op_stock = item.closing;
            item.f_receipt = 0;
            item.g_issues = 0;
            item.h_return = 0;
            item.closing = item.op_stock;
        });

        selectedIndex = -1;
        searchInput.value = '';
        selectedBadge.style.display = 'none';

        showToast(`Excel file එක Download වූ අතර දත්ත Reset විය!`, 'success');
    }

    // Restore Excel (.xlsx)
    function restoreFromXLSX() {
        const fileInput = document.getElementById('xlsxFileInput');
        const file = fileInput.files[0];
        if (!file) {
            showToast('කරුණාකර Excel File (.xlsx) එකක් තෝරන්න!', 'warning');
            return;
        }

        const reader = new FileReader();
        reader.onload = function(e) {
            try {
                const data = new Uint8Array(e.target.result);
                const workbook = XLSX.read(data, { type: 'array' });
                const worksheet = workbook.Sheets[workbook.SheetNames[0]];
                const rawJson = XLSX.utils.sheet_to_json(worksheet, { defval: "" });

                let restoredInventory = [];
                rawJson.forEach(row => {
                    let code = row["Material Code"] || row["Code"] || row["code"] || "";
                    let name = row["Material Name"] || row["Name"] || row["name"] || "";
                    if (code || name) {
                        let type = row["Type"] || row["type"] || "RM";
                        let uom = row["UOM"] || row["uom"] || "KG";
                        let op_stock = parseFloat(row["Op.Stock-Warehouse"] || row["Op.Stock"] || row["op_stock"]) || 0;
                        let f_receipt = parseFloat(row["Receipt"] || row["f_receipt"]) || 0;
                        let g_issues = parseFloat(row["Issues"] || row["g_issues"]) || 0;
                        let h_return = parseFloat(row["Return"] || row["h_return"]) || 0;
                        let closing = row["Closing Stock"] !== undefined && row["Closing Stock"] !== "" 
                                      ? parseFloat(row["Closing Stock"]) 
                                      : (op_stock + f_receipt - g_issues + h_return);

                        restoredInventory.push({ type: String(type), code: String(code), name: String(name), uom: String(uom), op_stock, f_receipt, g_issues, h_return, closing });
                    }
                });

                inventory = restoredInventory;
                closeSettings();
                showToast(`Excel Restore සාර්ථකයි! Items ${inventory.length} ක් එක් විය.`, 'success');
            } catch (err) {
                showToast('Excel කියවීමේදී දෝෂයක් සිදු විය!', 'error');
            }
        };
        reader.readAsArrayBuffer(file);
    }

    // Excel Backup Export (Without Resetting Stocks)
    function downloadXLSXBackup() {
        const exportData = inventory.map(item => ({
            "Type": item.type,
            "Material Code": item.code,
            "Material Name": item.name,
            "UOM": item.uom,
            "Op.Stock-Warehouse": item.op_stock,
            "Receipt": item.f_receipt,
            "Issues": item.g_issues,
            "Return": item.h_return,
            "Closing Stock": item.closing
        }));

        const worksheet = XLSX.utils.json_to_sheet(exportData);
        const workbook = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(workbook, worksheet, "Backup_Data");

        const today = new Date().toISOString().split('T')[0];
        const filename = `RMC_Stock_Backup_${today}.xlsx`;

        XLSX.writeFile(workbook, filename);
        showToast('Backup Excel ගොනුව Download විය!', 'success');
    }
</script>
