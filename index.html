<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Packs Count Calculator</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background-color: #f4f4f9;
        }
        .container {
            max-width: 500px;
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input[type="number"] {
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        .result-box {
            margin-top: 20px;
            padding: 15px;
            background: #e9ecef;
            border-radius: 4px;
        }
        .result-item {
            font-size: 18px;
            font-weight: bold;
            color: #333;
        }
        .error-message {
            color: red;
            font-size: 14px;
            display: none;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>තොග ගණන Calculator</h2>
    
    <div class="form-group">
        <label for="unitPrice">ඒකකයක මිල (Unit Price):</label>
        <input type="number" id="unitPrice" placeholder="0.00" step="0.01" min="0">
    </div>

    <div class="form-group">
        <label for="packsCount">කොටස් ගණන (Packs Count):</label>
        <input type="number" id="packsCount" placeholder="0" min="0" step="1">
    </div>

    <div id="errorMessage" class="error-message">කරුණාකර නිවැරදි ධනාත්මක සංඛ්‍යා ඇතුළත් කරන්න.</div>

    <div class="result-box">
        <div class="result-item">මුළු එකතුව (Total Amount): <span id="totalAmount">0.00</span></div>
    </div>
</div>

<script>
    // DOM Elements ලබා ගැනීම
    const unitPriceInput = document.getElementById('unitPrice');
    const packsCountInput = document.getElementById('packsCount');
    const totalAmountDisplay = document.getElementById('totalAmount');
    const errorMessage = document.getElementById('errorMessage');

    // ගණනය කිරීමේ ශ්‍රිතය (Calculate Function)
    function calculateTotal() {
        const unitPrice = parseFloat(unitPriceInput.value);
        const packsCount = parseInt(packsCountInput.value, 10);

        // Validation - ඍණ අගයන් හෝ නොමැති අගයන් පරීක්ෂාව
        if ((unitPriceInput.value !== "" && (isNaN(unitPrice) || unitPrice < 0)) || 
            (packsCountInput.value !== "" && (isNaN(packsCount) || packsCount < 0))) {
            errorMessage.style.display = 'block';
            totalAmountDisplay.textContent = '0.00';
            return;
        } else {
            errorMessage.style.display = 'none';
        }

        // අගයන් ඇතුළත් කර නොමැති විට 0 ලෙස ගැනීම
        const validUnitPrice = !isNaN(unitPrice) ? unitPrice : 0;
        const validPacksCount = !isNaN(packsCount) ? packsCount : 0;

        // මුළු එකතුව ගණනය කිරීම (Total = Unit Price * Packs Count)
        const total = validUnitPrice * validPacksCount;

        // අගය නිවැරදිව දශම ස්ථාන 2කට පෙන්වීම
        totalAmountDisplay.textContent = total.toFixed(2);
    }

    // Event Listeners යෙදීම (Input වෙනස්වන විටම Update වීම සඳහා)
    unitPriceInput.addEventListener('input', calculateTotal);
    packsCountInput.addEventListener('input', calculateTotal);
</script>

</body>
</html>
