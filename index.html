<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bin Card Manager</title>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <!-- SheetJS for Excel processing -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary: #4F46E5;
            --bg-color: #F3F4F6;
            --card-bg: #FFFFFF;
            --text-main: #1F2937;
            --text-muted: #6B7280;
            --success: #10B981;
            --danger: #EF4444;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
        }

        /* Header Styles */
        header {
            background-color: var(--primary);
            color: white;
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .search-container {
            flex: 1;
            max-width: 400px;
            margin: 0 20px;
            position: relative;
        }

        .search-container input {
            width: 100%;
            padding: 10px 40px 10px 15px;
            border-radius: 20px;
            border: none;
            outline: none;
            font-size: 1rem;
        }

        .search-container i {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
        }

        .settings-btn {
            background: none;
            border: none;
            color: white;
            font-size: 1.5rem;
            cursor: pointer;
            transition: transform 0.3s ease;
        }

        .settings-btn:hover {
            transform: rotate(90deg);
        }

        /* Modal Styles */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.5);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-content {
            background: white;
            padding: 2rem;
            border-radius: 15px;
            text-align: center;
            width: 90%;
            max-width: 400px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            position: relative;
            animation: slideIn 0.3s ease-out;
        }

        @keyframes slideIn {
            from { transform: translateY(-20px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .close-modal {
            position: absolute;
            top: 10px; right: 15px;
            font-size: 1.5rem;
            cursor: pointer;
            color: var(--text-muted);
        }

        .upload-area {
            border: 2px dashed var(--primary);
            padding: 2rem;
            border-radius: 10px;
            margin-top: 15px;
            cursor: pointer;
            transition: background 0.3s;
        }

        .upload-area:hover {
            background: #EEF2FF;
        }

        .upload-area i {
            font-size: 3rem;
            color: var(--primary);
            margin-bottom: 10px;
        }

        #fileInput {
            display: none;
        }

        /* Card Container Styles */
        main {
            padding: 2rem;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
        }

        .card {
            background: var(--card-bg);
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            border-left: 5px solid var(--primary);
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 15px rgba(0,0,0,0.1);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 15px;
            border-bottom: 1px solid #E5E7EB;
            padding-bottom: 10px;
        }

        .item-name {
            font-size: 1.2rem;
            font-weight: 600;
            color: var(--primary);
        }

        .item-code {
            font-size: 0.85rem;
            background: var(--bg-color);
            padding: 4px 8px;
            border-radius: 5px;
            color: var(--text-muted);
        }

        .card-body {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 15px;
        }

        .stat {
            display: flex;
            flex-direction: column;
        }

        .stat-label {
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .stat-value {
            font-size: 1.1rem;
            font-weight: 600;
        }

        .val-in { color: var(--success); }
        .val-out { color: var(--danger); }

        .card-footer {
            background: #F9FAFB;
            padding: 10px;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: 600;
        }

        .balance-val {
            font-size: 1.3rem;
            color: var(--primary);
        }

        .no-data {
            grid-column: 1 / -1;
            text-align: center;
            color: var(--text-muted);
            margin-top: 50px;
            font-size: 1.2rem;
        }
    </style>
</head>
<body>

    <!-- Header & Navigation -->
    <header>
        <div class="logo">
            <i class="fas fa-boxes"></i> Bin Card Updater
        </div>
        <div class="search-container">
            <input type="text" id="searchInput" placeholder="Search by Item Name or Code...">
            <i class="fas fa-search"></i>
        </div>
        <button class="settings-btn" id="settingsBtn" title="Settings / Upload">
            <i class="fas fa-cog"></i>
        </button>
    </header>

    <!-- Settings / Upload Modal -->
    <div id="settingsModal" class="modal">
        <div class="modal-content">
            <span class="close-modal" id="closeModal">&times;</span>
            <h2>Settings</h2>
            <p style="color: gray; font-size: 0.9rem; margin-top: 5px;">Update Bin Cards Data</p>
            
            <label for="fileInput">
                <div class="upload-area">
                    <i class="fas fa-cloud-upload-alt"></i>
                    <h3>Upload Excel File</h3>
                    <p style="font-size: 0.8rem; margin-top: 10px;">Select .xlsx or .xls file</p>
                </div>
            </label>
            <input type="file" id="fileInput" accept=".xlsx, .xls">
        </div>
    </div>

    <!-- Cards Display Area -->
    <main id="cardContainer">
        <div class="no-data">
            <i class="fas fa-folder-open" style="font-size: 3rem; margin-bottom: 10px; color: #cbd5e1;"></i>
            <p>Please click the settings icon (⚙️) and upload an Excel file to view Bin Cards.</p>
        </div>
    </main>

    <!-- JavaScript Logic -->
    <script>
        let binCardData = [];

        // Modal Controls
        const modal = document.getElementById('settingsModal');
        const settingsBtn = document.getElementById('settingsBtn');
        const closeModal = document.getElementById('closeModal');
        const fileInput = document.getElementById('fileInput');

        settingsBtn.onclick = () => modal.style.display = 'flex';
        closeModal.onclick = () => modal.style.display = 'none';
        window.onclick = (e) => { if (e.target == modal) modal.style.display = 'none'; }

        // File Upload and Excel Parsing
        fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                const data = new Uint8Array(e.target.result);
                const workbook = XLSX.read(data, {type: 'array'});
                const firstSheetName = workbook.SheetNames[0];
                const worksheet = workbook.Sheets[firstSheetName];
                
                // Convert Excel to JSON
                binCardData = XLSX.utils.sheet_to_json(worksheet);
                
                renderCards(binCardData);
                modal.style.display = 'none'; // Close modal after upload
                
                // Clear input to allow uploading the same file again if updated
                fileInput.value = ""; 
            };
            reader.readAsArrayBuffer(file);
        });

        // Search Filter Logic
        document.getElementById('searchInput').addEventListener('input', (e) => {
            const searchTerm = e.target.value.toLowerCase();
            const filteredData = binCardData.filter(item => {
                const itemName = (item['Item Name'] || item['ItemName'] || '').toString().toLowerCase();
                const itemCode = (item['Item Code'] || item['ItemCode'] || '').toString().toLowerCase();
                return itemName.includes(searchTerm) || itemCode.includes(searchTerm);
            });
            renderCards(filteredData);
        });

        // Render Cards Function
        function renderCards(data) {
            const container = document.getElementById('cardContainer');
            container.innerHTML = '';

            if (data.length === 0) {
                container.innerHTML = '<div class="no-data"><p>No items found.</p></div>';
                return;
            }

            data.forEach(item => {
                // Formatting data values (Handling different column names)
                const name = item['Item Name'] || item['ItemName'] || 'Unknown Item';
                const code = item['Item Code'] || item['ItemCode'] || 'N/A';
                const received = item['In'] || item['Received'] || 0;
                const issued = item['Out'] || item['Issued'] || 0;
                const balance = item['Balance'] || item['Qty'] || 0;

                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <div class="card-header">
                        <div class="item-name">${name}</div>
                        <div class="item-code">${code}</div>
                    </div>
                    <div class="card-body">
                        <div class="stat">
                            <span class="stat-label">Received (IN)</span>
                            <span class="stat-value val-in">+${received}</span>
                        </div>
                        <div class="stat">
                            <span class="stat-label">Issued (OUT)</span>
                            <span class="stat-value val-out">-${issued}</span>
                        </div>
                    </div>
                    <div class="card-footer">
                        <span>Current Balance</span>
                        <span class="balance-val">${balance}</span>
                    </div>
                `;
                container.appendChild(card);
            });
        }
    </script>

</body>
</html>
