<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NovaBrowser - Web App</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --nav-bg: #1e293b;
            --text-color: #f8fafc;
            --accent-color: #38bdf8;
            --border-color: #334155;
            --tab-active: #334155;
        }

        [data-theme="light"] {
            --bg-color: #f1f5f9;
            --nav-bg: #ffffff;
            --text-color: #0f172a;
            --accent-color: #0284c7;
            --border-color: #cbd5e1;
            --tab-active: #e2e8f0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            transition: background 0.3s, color 0.3s;
        }

        /* Top Browser Header (Tabs & Controls) */
        .browser-header {
            background-color: var(--nav-bg);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            padding: 8px 10px 0 10px;
            gap: 8px;
        }

        /* Tabs Bar */
        .tabs-bar {
            display: flex;
            gap: 5px;
            overflow-x: auto;
        }

        .tab {
            background: transparent;
            color: var(--text-color);
            border: 1px solid transparent;
            padding: 6px 15px;
            border-radius: 8px 8px 0 0;
            font-size: 13px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            max-width: 180px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .tab.active {
            background-color: var(--tab-active);
            border-color: var(--border-color);
            border-bottom: none;
        }

        .tab .close-tab {
            font-size: 12px;
            opacity: 0.6;
        }
        .tab .close-tab:hover {
            opacity: 1;
            color: #ef4444;
        }

        .new-tab-btn {
            background: transparent;
            color: var(--text-color);
            border: none;
            padding: 5px 10px;
            cursor: pointer;
            font-size: 16px;
            border-radius: 4px;
        }
        .new-tab-btn:hover {
            background: var(--border-color);
        }

        /* Navigation Controls Bar */
        .nav-bar {
            display: flex;
            align-items: center;
            gap: 8px;
            padding-bottom: 8px;
        }

        .nav-btn {
            background: transparent;
            color: var(--text-color);
            border: 1px solid var(--border-color);
            width: 34px;
            height: 34px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 14px;
        }
        .nav-btn:hover {
            border-color: var(--accent-color);
            color: var(--accent-color);
        }

        /* URL / Search Address Bar */
        .address-bar {
            flex: 1;
            display: flex;
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 5px 15px;
            align-items: center;
            gap: 10px;
        }

        .address-bar:focus-within {
            border-color: var(--accent-color);
        }

        .address-input {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            color: var(--text-color);
            font-size: 14px;
        }

        .theme-btn {
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 6px 12px;
            border-radius: 15px;
            cursor: pointer;
            font-size: 13px;
        }

        /* Browser Viewport (Websites Frame / Content Area) */
        .viewport-container {
            flex: 1;
            position: relative;
            background: #ffffff; /* White background for web pages */
        }

        .browser-iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: none;
        }

        .browser-iframe.active {
            display: block;
        }

        /* Homepage View (When opening a new tab) */
        .homepage {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--bg-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px;
        }

        .homepage h1 {
            font-size: 42px;
            color: var(--accent-color);
            margin-bottom: 10px;
        }

        .homepage p {
            color: var(--text-color);
            opacity: 0.7;
            margin-bottom: 25px;
        }

        .quick-links {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .quick-link-card {
            background: var(--nav-bg);
            border: 1px solid var(--border-color);
            padding: 15px 25px;
            border-radius: 12px;
            cursor: pointer;
            color: var(--text-color);
            font-weight: 600;
            text-decoration: none;
            transition: transform 0.2s;
        }
        .quick-link-card:hover {
            transform: translateY(-3px);
            border-color: var(--accent-color);
            color: var(--accent-color);
        }
    </style>
</head>
<body>

    <!-- Browser Top Bar -->
    <div class="browser-header">
        <!-- Tabs Section -->
        <div class="tabs-bar" id="tabsBar">
            <!-- Tabs will be generated by JS -->
        </div>

        <!-- Address & Navigation Controls -->
        <div class="nav-bar">
            <button class="nav-btn" onclick="goBack()" title="Back">←</button>
            <button class="nav-btn" onclick="goForward()" title="Forward">→</button>
            <button class="nav-btn" onclick="reloadPage()" title="Reload">⟳</button>
            
            <div class="address-bar">
                <span>🌐</span>
                <input type="text" id="addressInput" class="address-input" placeholder="Search or enter web address (e.g. wikipedia.org)..." onkeypress="handleAddressInput(event)">
            </div>

            <button class="theme-btn" onclick="toggleTheme()">☀️ / 🌙</button>
        </div>
    </div>

    <!-- Main Browsing Viewport -->
    <div class="viewport-container" id="viewportContainer">
        <!-- Dynamic Tabs content will be added here -->
    </div>

    <script>
        let tabs = [];
        let activeTabId = null;

        // Initialize with 1 default tab
        function initBrowser() {
            createNewTab("https://en.wikipedia.org", "Nova Home");
        }

        // Create a new tab
        function createNewTab(url = "", title = "New Tab") {
            const tabId = 'tab_' + Date.now();
            
            tabs.push({ id: tabId, url: url, title: title });
            setActiveTab(tabId);
            renderTabs();
            renderViewport();
        }

        // Close a tab
        function closeTab(event, tabId) {
            event.stopPropagation();
            if (tabs.length === 1) {
                // Don't close the last tab, just clear it to homepage
                tabs[0].url = "";
                tabs[0].title = "New Tab";
                setActiveTab(tabs[0].id);
                renderTabs();
                renderViewport();
                return;
            }

            const index = tabs.findIndex(t => t.id === tabId);
            tabs = tabs.filter(t => t.id !== tabId);

            if (activeTabId === tabId) {
                setActiveTab(tabs[tabs.length - 1].id);
            }
            renderTabs();
            renderViewport();
        }

        // Set active tab
        function setActiveTab(tabId) {
            activeTabId = tabId;
            const currentTab = tabs.find(t => t.id === tabId);
            if (currentTab) {
                document.getElementById('addressInput').value = currentTab.url || "";
            }
        }

        // Render Tabs Bar UI
        function renderTabs() {
            const tabsBar = document.getElementById('tabsBar');
            tabsBar.innerHTML = '';

            tabs.forEach(tab => {
                const tabEl = document.createElement('div');
                tabEl.className = `tab ${tab.id === activeTabId ? 'active' : ''}`;
                tabEl.onclick = () => {
                    setActiveTab(tab.id);
                    renderTabs();
                    renderViewport();
                };
                tabEl.innerHTML = `
                    <span>📄 ${tab.title || 'New Tab'}</span>
                    <span class="close-tab" onclick="closeTab(event, '${tab.id}')">✕</span>
                `;
                tabsBar.appendChild(tabEl);
            });

            const newBtn = document.createElement('button');
            newBtn.className = 'new-tab-btn';
            newBtn.innerHTML = '+';
            newBtn.onclick = () => createNewTab("", "New Tab");
            tabsBar.appendChild(newBtn);
        }

        // Render Viewport (Websites or Homepage)
        function renderViewport() {
            const container = document.getElementById('viewportContainer');
            container.innerHTML = '';

            tabs.forEach(tab => {
                if (tab.url === "") {
                    // Show Custom Homepage
                    const homeDiv = document.createElement('div');
                    homeDiv.className = `homepage ${tab.id === activeTabId ? '' : 'hidden'}`;
                    if (tab.id !== activeTabId) homeDiv.style.display = 'none';
                    
                    homeDiv.innerHTML = `
                        <h1>NovaBrowser</h1>
                        <p>Explore the web fast and securely with your custom web app browser.</p>
                        <div class="quick-links">
                            <a class="quick-link-card" onclick="loadUrlInActiveTab('https://en.wikipedia.org')">Wikipedia</a>
                            <a class="quick-link-card" onclick="loadUrlInActiveTab('https://lite.duckduckgo.com/lite/')">DuckDuckGo Lite</a>
                            <a class="quick-link-card" onclick="loadUrlInActiveTab('https://news.ycombinator.com/')">Hacker News</a>
                            <a class="quick-link-card" onclick="loadUrlInActiveTab('https://github.com/')">GitHub</a>
                        </div>
                    `;
                    container.appendChild(homeDiv);
                } else {
                    // Show Website inside Iframe
                    const iframe = document.createElement('iframe');
                    iframe.className = `browser-iframe ${tab.id === activeTabId ? 'active' : ''}`;
                    
                    // Handle URL formatting (Add https:// if missing)
                    let targetUrl = tab.url;
                    if (!targetUrl.startsWith('http://') && !targetUrl.startsWith('https://')) {
                        // If it's a search term, redirect to DuckDuckGo Lite search
                        targetUrl = `https://lite.duckduckgo.com/lite/?q=${encodeURIComponent(targetUrl)}`;
                    }

                    iframe.src = targetUrl;
                    container.appendChild(iframe);
                }
            });
        }

        // Load URL typed in address bar
        function handleAddressInput(event) {
            if (event.key === 'Enter') {
                const val = document.getElementById('addressInput').value.trim();
                loadUrlInActiveTab(val);
            }
        }

        function loadUrlInActiveTab(url) {
            const currentTab = tabs.find(t => t.id === activeTabId);
            if (currentTab) {
                currentTab.url = url;
                currentTab.title = url;
                renderTabs();
                renderViewport();
            }
        }

        // Navigation actions
        function reloadPage() {
            renderViewport();
        }

        function goBack() {
            // Simulated browser history back
        }

        function goForward() {
            // Simulated browser history forward
        }

        // Theme Toggle
        function toggleTheme() {
            const body = document.body;
            if (body.getAttribute('data-theme') === 'light') {
                body.removeAttribute('data-theme');
            } else {
                body.setAttribute('data-theme', 'light');
            }
        }

        // Start App
        window.onload = initBrowser;
    </script>
</body>
</html>
