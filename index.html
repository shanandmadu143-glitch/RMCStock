<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search by Name or Code</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons for Clear Button & Search Icon -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen p-4">

    <div class="bg-white p-6 rounded-2xl shadow-lg w-full max-w-md">
        <h2 class="text-xl font-bold text-gray-800 mb-4">Item Directory</h2>
        
        <!-- Search Container -->
        <div class="relative flex items-center mb-4">
            <!-- Search Icon (Optional styling enhancement) -->
            <span class="absolute left-3 text-gray-400">
                <i class="fa-solid fa-magnifying-glass text-sm"></i>
            </span>

            <!-- Search Input -->
            <input 
                type="text" 
                id="searchInput" 
                placeholder="Search by Name or Code..." 
                class="w-full pl-10 pr-10 py-2.5 border border-gray-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm transition-all"
                oninput="handleSearch()"
            >
            
            <!-- Clear Button (Hidden by default) -->
            <button 
                id="clearBtn" 
                type="button" 
                onclick="clearSearch()" 
                class="absolute right-3 text-gray-400 hover:text-red-500 focus:outline-none hidden transition-colors"
                title="Clear search"
            >
                <i class="fa-solid fa-xmark text-lg"></i>
            </button>
        </div>

        <!-- Results List Container -->
        <div id="resultList" class="space-y-2 max-h-60 overflow-y-auto pr-1">
            <!-- JavaScript මඟින් ඩේටා මෙතැනට Load වේ -->
        </div>

        <!-- No Results Message -->
        <div id="noResults" class="hidden text-center py-6 text-gray-500 text-sm">
            No matching items found.
        </div>
    </div>

    <!-- JavaScript Implementation -->
    <script>
        // සාම්පල දත්ත ලැයිස්තුව (ඔබට අවශ්‍ය දත්ත මෙයට මාරු කරගත හැක)
        const itemsData = [
            { code: "PRD-001", name: "Wireless Mouse" },
            { code: "PRD-002", name: "Mechanical Keyboard" },
            { code: "PRD-003", name: "Gaming Monitor" },
            { code: "PRD-004", name: "USB-C Hub" },
            { code: "PRD-005", name: "Bluetooth Headphones" },
            { code: "PRD-006", name: "External Hard Drive" }
        ];

        const searchInput = document.getElementById('searchInput');
        const clearBtn = document.getElementById('clearBtn');
        const resultList = document.getElementById('resultList');
        const noResults = document.getElementById('noResults');

        // මුල් අවස්ථාවේ සියලු දත්ත පෙන්වීම සඳහා
        window.onload = function() {
            displayItems(itemsData);
            toggleClearButton();
        };

        // Search සහ Clear බටන් පාලනය කරන ප්‍රධාන කාර්යය
        function handleSearch() {
            const query = searchInput.value.trim().toLowerCase();
            toggleClearButton();

            // නම හෝ කේතය (Name or Code) හරහා ෆිල්ටර් කිරීම
            const filteredData = itemsData.filter(item => 
                item.name.toLowerCase().includes(query) || 
                item.code.toLowerCase().includes(query)
            );

            displayItems(filteredData);
        }

        // ලැයිස්තුව HTML වෙත Render කිරීම
        function displayItems(data) {
            resultList.innerHTML = '';

            if (data.length === 0) {
                noResults.classList.remove('hidden');
            } else {
                noResults.classList.add('hidden');
                data.forEach(item => {
                    const div = document.createElement('div');
                    div.className = "flex justify-between items-center p-3 bg-gray-50 hover:bg-blue-50 rounded-lg border border-gray-200 transition-colors cursor-pointer";
                    div.innerHTML = `
                        <span class="font-medium text-gray-800 text-sm">${item.name}</span>
                        <span class="text-xs font-semibold bg-blue-100 text-blue-600 px-2 py-1 rounded-md">${item.code}</span>
                    `;
                    // කෝඩ් එකක් හෝ නමක් ක්ලික් කළ විට ඉන්පුට් එකට ලබාදීමට අවශ්‍ය නම්:
                    div.onclick = function() {
                        searchInput.value = item.name;
                        handleSearch();
                    };
                    resultList.appendChild(div);
                });
            }
        }

        // Clear බටන් එක පෙන්වීම හෝ සැඟවීම
        function toggleClearButton() {
            if (searchInput.value.length > 0) {
                clearBtn.classList.remove('hidden');
            } else {
                clearBtn.classList.add('hidden');
            }
        }

        // ඉන්පුට් එක Clear කිරීමේ ක්‍රියාවලිය
        function clearSearch() {
            searchInput.value = '';
            clearBtn.classList.add('hidden');
            displayItems(itemsData); // මුල් ලැයිස්තුව නැවත පෙන්වයි
            searchInput.focus();     // නැවත ඉන්පුට් එකට Focus කරයි
        }
    </script>

</body>
</html>
